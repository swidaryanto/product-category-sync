name: Sync

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_CONNECTED_ACCOUNT_ID: ${{ vars.COMPOSIO_CONNECTED_ACCOUNT_ID }}
        run: node scripts/sync.js

      - name: Commit updated status
        run: |
          git config user.name "product-category-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/status.json
          git diff --cached --quiet && echo "No status change." || git commit -m "chore: sync product category, update status.json [skip ci]"
          git push
